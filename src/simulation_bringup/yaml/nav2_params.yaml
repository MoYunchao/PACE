bt_navigator_rclcpp_node:
  ros__parameters:
    use_sim_time: True
controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 15.0    # 降低到5Hz,雷达10Hz时每次都有新数据
    odom_topic: /odom
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3       # 实车版本：标准容忍 (原 0.5)
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5  # 实车版本：标准检测 (原 0.3)
      movement_time_allowance: 10.0  # 实车版本：标准时间 (原 15.0)

    # Goal checker parameters
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.5        # 放宽位置容差，配合短 sim_time
      yaw_goal_tolerance: 3.14      # 全向轮不需要严格角度对齐
    # DWB parameters - 纯全向轮模式 (无转向对齐)
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      min_vel_x: -1.5
      min_vel_y: -1.5
      max_vel_x: 1.5
      max_vel_y: 1.5
      max_vel_theta: 3.0
      min_speed_xy: 0.0
      max_speed_xy: 1.5
      min_speed_theta: 0.0
      acc_lim_x: 3.0
      acc_lim_y: 3.0
      acc_lim_theta: 5.0
      decel_lim_x: -3.0
      decel_lim_y: -3.0
      decel_lim_theta: -5.0
      vx_samples: 20
      vy_samples: 20
      vtheta_samples: 5
      sim_time: 0.5
      linear_granularity: 0.05
      angular_granularity: 0.05
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.5
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics: ["Oscillation", "BaseObstacle", "GoalDist", "PathDist", "Twirling"]
      BaseObstacle.scale: 2.0
      GoalDist.scale: 12.0
      PathDist.scale: 72.0
      Twirling.scale: 5.0
      Oscillation.reset_period: 0.05
      
controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: True

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0        # 降低到5Hz,与controller同步
      publish_frequency: 5.0
      global_frame: odom           # 恢复：局部地图用odom帧 (原 map) ⚠️
      #global_frame: map
      robot_base_frame: base_link
      use_sim_time: True
      odom_topic: /odom
      transform_tolerance: 0.15
      rolling_window: true
      width: 10                    # 增加：给机器人更多活动空间 (原 6)
      height: 10                   # 增加：给机器人更多活动空间 (原 6)
      resolution: 0.05              # 保持：5cm 分辨率
      robot_radius: 0.13          # 更新：base(0.1) + 较小轮子突出(0.03) ≈ 0.13m
      plugins: ["voxel2d_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0     # 更快衰减，让机器人更靠近路径中心
        inflation_radius: 0.30       # 0.13(robot) + 0.42(inflation) = 0.55m总半径，保持相同安全距离
      voxel2d_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: False
        origin_z: 0.0              # 从地面开始,避免地面被识别为障碍物
        z_resolution: 0.05         # 保持:精细的Z轴分辨率
        z_voxels: 16               # 实车版本:更多Z层 (原 10)
        max_obstacle_height: 2.0
        mark_threshold: 0          # 改回0,任何观测都标记(原2)
        unknown_threshold: 8       # 8次未观测就清除(1.6秒@5Hz)
        combination_method: 1      # 最大值合并法
        observation_sources: scan
        scan:
          topic: /scan
          sensor_data_qos: true
          obstacle_max_range: 2.5  # 障碍物标记范围
          obstacle_min_range: 0.0
          raytrace_min_range: 0.0
          raytrace_max_range: 3.0  # raytrace清除范围大于obstacle
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          expected_update_rate: 0.0  # 不强制要求更新率,容忍短暂数据丢失
        
      voxel3d_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: False             # 禁用3D层，只使用2D scan
        publish_voxel_map: False
        origin_z: 0.0              # 从地面开始
        z_resolution: 0.05         # 实车版本：更精细 (原 0.1)
        z_voxels: 16               # 实车版本：更多层 (原 8)
        mark_threshold: 1
        observation_sources: livox
        min_obstacle_height: 0.00
        max_obstacle_height: 2.0 
        livox:
          topic: /livox/lidar/pointcloud
          raytrace_min_range: 0.0
          raytrace_max_range: 3.0
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0 
          clearing: True
          marking: True
          data_type: "PointCloud2"
      static_layer:
        map_subscribe_transient_local: True
      always_send_full_costmap: True  # 实车版本：发送完整地图 (原 False)
  local_costmap_client:
    ros__parameters:
      use_sim_time: True
  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0        # 全局地图低频更新即可
      publish_frequency: 0.5       # 降低发布频率
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: True
      transform_tolerance: 0.5
      robot_radius: 0.13           # 更新：与local_costmap保持一致
      resolution: 0.05             # 实车版本：更精细 (原 0.1)
      track_unknown_space: true
      always_send_full_costmap: False
      rolling_window: False
      plugins: ["static_layer", "voxel2d_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
        map_topic: /map
        enabled: True
        subscribe_to_updates: True
        unknown_cost_value: 255         # 🔴 无地图时标记为未知而非致命
        trinary_costmap: True
        track_unknown_space: True
        use_maximum: False
      voxel2d_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          sensor_data_qos: true
          raytrace_min_range: 0.0
          raytrace_max_range: 3.0
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
      voxel3d_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: False              # 实车版本：启用3D层 (原 False)
        publish_voxel_map: False
        origin_z: -0.1              # 实车版本：从0开始 (原 -0.1)
        z_resolution: 0.05         # 实车版本：更精细 (原 0.1)
        z_voxels: 16               # 实车版本：更多层 (原 8)
        mark_threshold: 1
        observation_sources: livox
        min_obstacle_height: 0.00
        max_obstacle_height: 2.0 
        livox:
          topic: /livox/lidar/pointcloud
          raytrace_min_range: 0.0
          raytrace_max_range: 3.0
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0 
          clearing: True
          marking: True
          data_type: "PointCloud2"
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.5     # 平衡安全和通行能力
        inflation_radius: 0.38       # 与local_costmap保持一致，0.13+0.42=0.55m总半径
      always_send_full_costmap: True  # 实车版本：发送完整地图 (原 False)
  global_costmap_client:
    ros__parameters:
      use_sim_time: True
  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: True

map_server:
  ros__parameters:
    use_sim_time: True
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: True
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0   # 降低至1Hz，路径规划低频即可
    use_sim_time: True
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      tolerance: 0.5                 # 更精确的目标容差
      allow_unknown: true
      cost_travel_multiplier: 2.0     # 惩罚因子：让规划器更倾向于走低代价区域（路中间）

# planner_server_rclcpp_node:
#   ros__parameters:
#     use_sim_time: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "follow_the_gap", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
      simulate_ahead_time: 2.0
    follow_the_gap:
      plugin: "follow_the_gap_recovery/FollowTheGapRecovery"
      min_obstacle_distance: 0.3      # Stop recovery when closest obstacle > 0.2m
      max_linear_velocity: 2.0        # Maximum velocity towards gap (m/s)
      min_gap_distance: 0.5           # Minimum distance to consider as gap (m)
      min_gap_width: 10               # Minimum gap width in scan points
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_link
    transform_timeout: 0.2
    use_sim_time: True
    simulate_ahead_time: 2.0
    max_rotational_vel: 20.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 10.0

robot_state_publisher:
  ros__parameters:
    use_sim_time: True

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"   
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 10.0
    scale_velocities: False
    feedback: "CLOSED_LOOP"
    max_velocity: [1.5, 1.5, 3.0]
    min_velocity: [-1.5, -1.5, -3.0]
    max_accel: [3.0, 3.0, 5.0]
    max_decel: [-3.0, -3.0, -5.0]
    odom_topic: "odom"             # 修正：实际里程计话题是 /odom
    odom_duration: 0.1           # 实车版本：更快响应 (原 0.5)
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0        # 实车版本：更严格 (原 2.0)