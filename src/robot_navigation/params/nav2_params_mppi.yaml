  bt_navigator:
    ros__parameters:
      use_sim_time: True
      global_frame: robot_0/map
      robot_base_frame: robot_0/base_link
      odom_topic: /robot_0/odom
      bt_loop_duration: 10
      default_server_timeout: 20
      enable_groot_monitoring: True
      groot_zmq_publisher_port: 1666
      groot_zmq_server_port: 1667
      default_nav_to_pose_bt_xml: /home/huishao/SenseSimulation/install/robot_navigation/share/robot_navigation/behavior_trees/navigate_to_pose_w_replanning_and_follow_gap.xml
      default_nav_through_poses_bt_xml: /home/huishao/SenseSimulation/install/robot_navigation/share/robot_navigation/behavior_trees/navigate_w_replanning_and_follow_gap.xml
      plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - follow_the_gap_action_bt_node

  bt_navigator_rclcpp_node:
    ros__parameters:
      use_sim_time: True

  controller_server:
    ros__parameters:
      use_sim_time: True
      controller_frequency: 15.0
      odom_topic: /robot_0/odom
      min_x_velocity_threshold: 0.001
      min_y_velocity_threshold: 0.001
      min_theta_velocity_threshold: 0.001
      failure_tolerance: 0.5
      progress_checker_plugin: "progress_checker"
      goal_checker_plugins: ["general_goal_checker"]
      controller_plugins: ["FollowPath"]

      progress_checker:
        plugin: "nav2_controller::SimpleProgressChecker"
        required_movement_radius: 0.5
        movement_time_allowance: 10.0

      general_goal_checker:
        stateful: True
        plugin: "nav2_controller::SimpleGoalChecker"
        xy_goal_tolerance: 0.8
        yaw_goal_tolerance: 3.14

      # MPPI Controller - 全向轮优化配置 (平衡版 v2)
      FollowPath:
        plugin: "nav2_mppi_controller::MPPIController"
        time_steps: 48
        model_dt: 0.07
        batch_size: 2000
        vx_std: 0.6
        vy_std: 0.6
        wz_std: 0.5
        vx_max: 2.5
        vx_min: -2.5
        vy_max: 2.5
        wz_max: 4.0
        iteration_count: 1
        prune_distance: 2.0
        transform_tolerance: 0.5
        temperature: 0.3
        gamma: 0.015
        motion_model: "Omni"
        visualize: false
        regenerate_noises: true
        retry_attempt_limit: 1
        TrajectoryVisualizer:
          trajectory_step: 5
          time_step: 3
        AckermannConstraints:
          min_turning_r: 0.2
        critics: [
          "ConstraintCritic", "ObstaclesCritic", "CostCritic", "GoalCritic",
          "PathFollowCritic", "PathAngleCritic"
        ]
        ConstraintCritic:
          enabled: true
          cost_power: 1
          cost_weight: 4.0
        # ObstaclesCritic: 排斥力，主动远离障碍物
        ObstaclesCritic:
          enabled: true
          cost_power: 1
          repulsion_weight: 1.5
          critical_weight: 20.0
          consider_footprint: false
          collision_cost: 10000.0
          collision_margin_distance: 0.15
          near_goal_distance: 0.5
        GoalCritic:
          enabled: true
          cost_power: 1
          cost_weight: 3.0
          threshold_to_consider: 0.2
        # CostCritic: costmap 避障 (主要避障手段)
        CostCritic:
          enabled: true
          cost_power: 1
          cost_weight: 5.0
          critical_cost: 300.0
          consider_footprint: false
          collision_cost: 1000000.0
          near_goal_distance: 0.3
          trajectory_point_step: 2
        # PathFollowCritic: 跟随全局路径
        PathFollowCritic:
          enabled: true
          cost_power: 1
          cost_weight: 3.0
          offset_from_furthest: 5
          threshold_to_consider: 0.6
        # PathAngleCritic: 对齐路径方向
        PathAngleCritic:
          enabled: true
          cost_power: 1
          cost_weight: 10.0
          offset_from_furthest: 4
          threshold_to_consider: 0.5
          max_angle_to_furthest: 1.0
          mode: 0

  controller_server_rclcpp_node:
    ros__parameters:
      use_sim_time: True

  local_costmap:
    local_costmap:
      ros__parameters:
        update_frequency: 10.0
        publish_frequency: 5.0
        global_frame: robot_0/odom
        robot_base_frame: robot_0/base_link
        use_sim_time: True
        odom_topic: /robot_0/odom
        transform_tolerance: 0.3
        rolling_window: true
        width: 10
        height: 10
        resolution: 0.05
        robot_radius: 0.13
        plugins: ["voxel2d_layer", "inflation_layer"]
        inflation_layer:
          plugin: "nav2_costmap_2d::InflationLayer"
          cost_scaling_factor: 2.5
          inflation_radius: 0.45
        voxel2d_layer:
          plugin: "nav2_costmap_2d::VoxelLayer"
          enabled: True
          publish_voxel_map: False
          origin_z: 0.0
          z_resolution: 0.05
          z_voxels: 16
          max_obstacle_height: 2.0
          mark_threshold: 0
          unknown_threshold: 8
          combination_method: 1
          observation_sources: scan
          scan:
            topic: /robot_0/scan
            sensor_data_qos: true
            obstacle_max_range: 2.5
            obstacle_min_range: 0.0
            raytrace_min_range: 0.0
            raytrace_max_range: 3.0
            min_obstacle_height: 0.0
            max_obstacle_height: 2.0
            clearing: True
            marking: True
            data_type: "LaserScan"
            expected_update_rate: 0.0
        always_send_full_costmap: True
    local_costmap_client:
      ros__parameters:
        use_sim_time: True
    local_costmap_rclcpp_node:
      ros__parameters:
        use_sim_time: True

  global_costmap:
    global_costmap:
      ros__parameters:
        update_frequency: 1.0
        publish_frequency: 0.5
        global_frame: robot_0/map
        robot_base_frame: robot_0/base_link
        use_sim_time: True
        transform_tolerance: 0.5
        robot_radius: 0.13
        resolution: 0.05
        track_unknown_space: true
        always_send_full_costmap: False
        rolling_window: False
        plugins: ["static_layer", "voxel2d_layer", "inflation_layer"]
        static_layer:
          plugin: "nav2_costmap_2d::StaticLayer"
          map_subscribe_transient_local: True
          map_topic: /robot_0/map
          enabled: True
          subscribe_to_updates: True
          unknown_cost_value: 255
          trinary_costmap: True
          track_unknown_space: True
          use_maximum: False
        voxel2d_layer:
          plugin: "nav2_costmap_2d::ObstacleLayer"
          enabled: True
          observation_sources: scan
          scan:
            topic: /robot_0/scan
            sensor_data_qos: true
            raytrace_min_range: 0.0
            raytrace_max_range: 3.0
            min_obstacle_height: 0.0
            max_obstacle_height: 2.0
            clearing: True
            marking: True
            data_type: "LaserScan"
        inflation_layer:
          plugin: "nav2_costmap_2d::InflationLayer"
          cost_scaling_factor: 3.5
          inflation_radius: 0.38
        always_send_full_costmap: True
    global_costmap_client:
      ros__parameters:
        use_sim_time: True
    global_costmap_rclcpp_node:
      ros__parameters:
        use_sim_time: True

  map_server:
    ros__parameters:
      use_sim_time: True
      yaml_filename: ""

  map_saver:
    ros__parameters:
      use_sim_time: True
      save_map_timeout: 5.0
      free_thresh_default: 0.25
      occupied_thresh_default: 0.65
      map_subscribe_transient_local: True

  planner_server:
    ros__parameters:
      expected_planner_frequency: 1.0
      use_sim_time: True
      planner_plugins: ["GridBased"]
      GridBased:
        plugin: "nav2_smac_planner/SmacPlanner2D"
        tolerance: 0.5
        allow_unknown: true
        cost_travel_multiplier: 2.0

  behavior_server:
    ros__parameters:
      costmap_topic: local_costmap/costmap_raw
      footprint_topic: local_costmap/published_footprint
      cycle_frequency: 10.0
      behavior_plugins: ["spin", "follow_the_gap", "wait"]
      spin:
        plugin: "nav2_behaviors/Spin"
        simulate_ahead_time: 2.0
      follow_the_gap:
        plugin: "follow_the_gap_recovery/FollowTheGapRecovery"
        min_obstacle_distance: 0.3
        max_linear_velocity: 2.0
        min_gap_distance: 0.5
        min_gap_width: 10
      wait:
        plugin: "nav2_behaviors/Wait"
      global_frame: robot_0/odom
      robot_base_frame: robot_0/base_link
      transform_timeout: 0.2
      use_sim_time: True
      simulate_ahead_time: 2.0
      max_rotational_vel: 20.0
      min_rotational_vel: 0.4
      rotational_acc_lim: 10.0

  robot_state_publisher:
    ros__parameters:
      use_sim_time: True

  waypoint_follower:
    ros__parameters:
      use_sim_time: True
      loop_rate: 20
      stop_on_failure: false
      waypoint_task_executor_plugin: "wait_at_waypoint"
      wait_at_waypoint:
        plugin: "nav2_waypoint_follower::WaitAtWaypoint"
        enabled: True
        waypoint_pause_duration: 200

  velocity_smoother:
    ros__parameters:
      use_sim_time: True
      smoothing_frequency: 10.0
      scale_velocities: False
      feedback: "CLOSED_LOOP"
      max_velocity: [2.5, 2.5, 4.0]
      min_velocity: [-2.5, -2.5, -4.0]
      max_accel: [4.0, 4.0, 6.0]
      max_decel: [-4.0, -4.0, -6.0]
      odom_topic: "odom"
      odom_duration: 0.1
      deadband_velocity: [0.0, 0.0, 0.0]
      velocity_timeout: 1.0
